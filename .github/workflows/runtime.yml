name: runtime

# Holds the Quickshell and SwiftUI runtimes (runtimes/quickshell, runtimes/swiftui) to the language's
# reference implementation, tools/owl.jar: same output on every store widget,
# same verdicts from the checker. Runs when either side changes, and when a
# widget does, since every widget is one of the cases.
on:
  pull_request:
    paths: ["runtimes/**", "tools/owl.jar", "widgets/**"]
  push:
    branches: [main]
    paths: ["runtimes/**", "tools/owl.jar", "widgets/**"]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Owl.js matches owl.jar
        run: runtimes/quickshell/test/run.sh

  # The SwiftUI runtime runs the same Owl.js in JavaScriptCore: run.sh checks it there too on a Mac, and the
  # package's tests check its bundled copy of Owl.js and what it adds around the language.
  swiftui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OwlKit's tests
        run: swift test --package-path runtimes/swiftui
      - name: Owl.js in JavaScriptCore matches owl.jar
        run: runtimes/quickshell/test/run.sh
