name: publish

# Builds index.json from the reviewed widgets on main, faces.json from the faces and apps.json from
# the apps, and publishes the store to GitHub Pages. Faces and apps have catalogs of their own so
# launchers from before them never see one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # owl.jar dates each app by the commit that added it.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Order
        # A new order for every push: the ids order.txt lists keep their place, and every other
        # widget, face and app goes before its "..." in a shuffled order, so the middle of "all" isn't
        # alphabetical. Seeded by the commit, so re-running a push publishes the same order.
        run: |
          listed=$(sed 's/#.*//; s/[[:space:]]//g; /^$/d' order.txt)
          rest=$(ls -d widgets/*/*/ faces/*/*/ apps/*/*/ | cut -d/ -f2,3 | grep -vxF -f <(echo "$listed") \
            | shuf --random-source=<(openssl enc -aes-256-ctr -pass pass:"$GITHUB_SHA" -nosalt </dev/zero 2>/dev/null))
          grep -qx '\.\.\.' order.txt || echo ... >> order.txt
          { sed '/^\.\.\.$/,$d' order.txt; echo "$rest"; sed -n '/^\.\.\.$/,$p' order.txt; } > order.tmp
          mv order.tmp order.txt
      - name: Catalog
        run: |
          java -jar tools/owl.jar index .
          java -jar tools/owl.jar index . --faces
          java -jar tools/owl.jar index . --apps
      - name: Site
        run: |
          mkdir _site
          cp -r index.json faces.json apps.json widgets faces apps w _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
