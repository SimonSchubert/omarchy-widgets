name: review

# Checks every widget a pull request adds or changes and writes a summary for
# the reviewer: what it runs, what it installs, and anything that looks risky.
on:
  pull_request:
    paths: ["widgets/**"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  review:
    runs-on: ubuntu-latest
    # Arch, so package names and file owners are checked against the real repositories.
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git jre-openjdk-headless >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- widgets > changed.txt
          cat changed.txt

      - name: Only widget files, only in your own folder
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
          ROLE: ${{ github.event.pull_request.author_association }}
        run: |
          login=$(echo "$LOGIN" | tr 'A-Z' 'a-z')
          bad=0
          while read -r f; do
            case "$f" in
              widgets/*/*/widget.owl|widgets/*/*/preview.png|widgets/*/*/README.md) ;;
              *) echo "::error file=$f::a widget folder holds only widget.owl, preview.png and README.md"; bad=1 ;;
            esac
            author=$(echo "$f" | cut -d/ -f2)
            if [ "$author" != "$login" ] && [ "$ROLE" != OWNER ] && [ "$ROLE" != MEMBER ]; then
              echo "::error file=$f::widgets/$author/ belongs to @$author; put yours under widgets/$login/"
              bad=1
            fi
            if [ -f "$f" ] && [ "${f##*.}" = png ] && [ "$(stat -c %s "$f")" -gt 307200 ]; then
              echo "::error file=$f::preview.png is over 300 KB"
              bad=1
            fi
          done < changed.txt
          exit $bad

      - name: Review
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          mkdir -p base
          files=""
          while read -r f; do
            [ "${f##*/}" = widget.owl ] || continue
            files="$files $f"
            if git cat-file -e "$base:$f" 2>/dev/null; then
              mkdir -p "base/$(dirname "$f")"
              git show "$base:$f" > "base/$f"
            fi
          done < changed.txt
          [ -z "$files" ] && exit 0
          java -jar tools/owl.jar review . $files --base base | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Packages
        run: |
          pacman -Fy --noconfirm >/dev/null
          bad=0
          while read -r f; do
            [ "${f##*/}" = widget.owl ] && [ -f "$f" ] || continue
            java -jar tools/owl.jar programs "$f" > deps.txt
            declared=$(awk '$1 == "pacman" { print $2 }' deps.txt)
            echo "#### Packages for \`$f\`" >> "$GITHUB_STEP_SUMMARY"
            for p in $declared; do
              if pacman -Si "$p" >/dev/null 2>&1; then
                echo "- ✅ $p" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error file=$f::package $p isn't in the Arch repositories"
                echo "- ❌ $p isn't in the Arch repositories" >> "$GITHUB_STEP_SUMMARY"
                bad=1
              fi
            done
            # Programs whose package is neither declared nor part of a base system.
            for prog in $(awk '$1 == "program" { print $2 }' deps.txt); do
              owner=$(pacman -Fq "usr/bin/$prog" 2>/dev/null | head -1 | cut -d/ -f2)
              if [ -z "$owner" ]; then
                echo "- ⚠️ \`$prog\`: no Arch package provides it" >> "$GITHUB_STEP_SUMMARY"
              elif ! echo "$declared" | grep -qx "$owner" && ! pacman -Qq "$owner" >/dev/null 2>&1; then
                echo "- ⚠️ \`$prog\` comes from **$owner**, which isn't in requires" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done < changed.txt
          exit $bad
